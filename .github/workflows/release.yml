name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Stage plugin package
        id: stage
        shell: bash
        run: |
          set -euxo pipefail
          # 从 plugin.json 读取插件名与版本，构造带版本号的 zip 文件名
          NAME=$(node -p "require('./plugin.json').name")
          VERSION=$(node -p "require('./plugin.json').version")
          ZIP_FILE="dist/package/${NAME}-${VERSION}.zip"
          echo "Staging package: ${ZIP_FILE}"
          ls -la dist/package
          test -f "${ZIP_FILE}" && echo "zip generated: ${ZIP_FILE}"
          echo "zip_file=${ZIP_FILE}" >> "$GITHUB_ENV"

      - name: Write release notes
        shell: bash
        run: |
          NOTES=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" 2>/dev/null || true)
          if [ -z "$NOTES" ]; then
            NOTES="Auto-generated release for $GITHUB_REF_NAME"
          fi
          printf '%s\n' "$NOTES" > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: ${{ env.zip_file }}
